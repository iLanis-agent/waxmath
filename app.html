<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaxMath</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #0f141b; color: #e8eef5; max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin: 0 0 4px; }
  p.sub { color: #9fb0c3; margin: 0 0 20px; }
  .presets { margin: 0 0 20px; }
  .presets button { background: #1c2530; color: #9fc2e8; border: 1px solid #2d3b4d; border-radius: 999px; padding: 8px 16px; margin: 0 8px 8px 0; cursor: pointer; font-size: .9rem; }
  .presets button:hover { background: #253243; }
  section { background: #16202c; border: 1px solid #243143; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  h2 { margin: 0 0 14px; font-size: 1.05rem; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; }
  label { display: block; font-size: .8rem; color: #9fb0c3; margin-bottom: 4px; }
  input { background: #0f141b; border: 1px solid #2d3b4d; color: #e8eef5; border-radius: 8px; padding: 9px 10px; width: 100px; font-size: 1rem; }
  .outs { display: flex; flex-wrap: wrap; gap: 14px; }
  .out { background: #101922; border: 1px solid #243143; border-radius: 12px; padding: 14px 18px; min-width: 140px; flex: 1; }
  .out .v { font-size: 1.4rem; font-weight: 700; color: #7fc4ff; }
  .out .k { font-size: .8rem; color: #9fb0c3; margin-top: 4px; }
  .wide { min-width: 260px; }
  .wide .v { font-size: 1.05rem; line-height: 1.45; }
</style>
</head>
<body>
<h1>&#128191; WaxMath</h1>
<p class="sub">Vinyl and turntable math - the tonearm is a physics problem.</p>
<div class="presets" id="presets"></div>

<section>
  <h2>1. Tonearm resonance</h2>
  <div class="row">
    <div><label>Effective mass (g)</label><input id="mass" type="number" step="0.5" value="15"></div>
    <div><label>Compliance (cu)</label><input id="compliance" type="number" step="1" value="10"></div>
  </div>
  <div class="outs">
    <div class="out"><div class="v" id="o-res">-</div><div class="k">Resonance</div></div>
    <div class="out wide"><div class="v" id="o-resverdict">-</div><div class="k">Verdict</div></div>
  </div>
</section>

<section>
  <h2>2. Groove velocity</h2>
  <div class="row">
    <div><label>Radius (cm)</label><input id="radius" type="number" step="0.1" value="6"></div>
    <div><label>RPM</label><input id="rpm" type="number" step="0.01" value="33.33"></div>
  </div>
  <div class="outs">
    <div class="out"><div class="v" id="o-vel">-</div><div class="k">Groove velocity</div></div>
    <div class="out wide"><div class="v" id="o-velverdict">-</div><div class="k">Fidelity verdict</div></div>
  </div>
</section>

<section>
  <h2>3. Stylus life</h2>
  <div class="row">
    <div><label>Rated life (h)</label><input id="life" type="number" step="50" value="1000"></div>
    <div><label>Hours used</label><input id="used" type="number" step="10" value="400"></div>
    <div><label>Listening (h/day)</label><input id="perday" type="number" step="0.5" value="2"></div>
  </div>
  <div class="outs">
    <div class="out"><div class="v" id="o-left">-</div><div class="k">Hours left</div></div>
    <div class="out"><div class="v" id="o-days">-</div><div class="k">Days of listening</div></div>
    <div class="out"><div class="v" id="o-sides">-</div><div class="k">Sides per stylus</div></div>
  </div>
</section>

<script>
// WaxMath engine - vinyl and turntable math. Pure functions, no DOM.
(function (root) {
  'use strict';

  // Tonearm/cartridge resonance: f (Hz) = 159 / sqrt(effectiveMass_g * compliance_cu).
  function resonance(massG, complianceCu) {
    if (massG <= 0 || complianceCu <= 0) throw new Error('mass and compliance must be positive');
    return 159 / Math.sqrt(massG * complianceCu);
  }

  // Resonance verdict: the 8-12 Hz band is the classic sweet spot.
  function resonanceVerdict(f) {
    if (f < 5) return 'danger zone - footfalls and warps will shake the groove';
    if (f < 8) return 'low - close to record warp frequencies, watch the woofers pump';
    if (f <= 12) return 'sweet spot - warps below, music above';
    if (f <= 15) return 'high - creeping into audible bass, may thicken the low end';
    return 'too high - inside the music band, will color the bass';
  }

  // Linear groove velocity (cm/s) at radius r (cm) and rpm.
  function grooveVelocity(radiusCm, rpm) {
    if (radiusCm <= 0 || rpm <= 0) throw new Error('positive values only');
    return 2 * Math.PI * radiusCm * rpm / 60;
  }

  // Inner-groove distortion verdict from the slowest radius velocity.
  function velocityVerdict(v) {
    if (v >= 40) return 'fast groove - clean tracking, low distortion';
    if (v >= 25) return 'comfortable - good fidelity';
    if (v >= 15) return 'inner-groove zone - sibilance risk rises';
    return 'slow groove - end-of-side distortion territory';
  }

  // Stylus life remaining. lifeHours typical 600-1500.
  function stylusLeft(lifeHours, usedHours) {
    if (lifeHours <= 0 || usedHours < 0) throw new Error('bad inputs');
    return Math.max(0, lifeHours - usedHours);
  }
  function listeningDays(hoursLeft, hoursPerDay) {
    if (hoursPerDay <= 0) throw new Error('bad inputs');
    return hoursLeft / hoursPerDay;
  }

  // Sides per stylus life: one LP side ~ 22 min.
  function sidesPerStylus(lifeHours, sideMinutes) {
    if (lifeHours <= 0 || sideMinutes <= 0) throw new Error('bad inputs');
    return Math.floor(lifeHours * 60 / sideMinutes);
  }

  var api = {
    resonance: resonance,
    resonanceVerdict: resonanceVerdict,
    grooveVelocity: grooveVelocity,
    velocityVerdict: velocityVerdict,
    stylusLeft: stylusLeft,
    listeningDays: listeningDays,
    sidesPerStylus: sidesPerStylus
  };
  root.WaxMath = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  var E = window.WaxMath;
  function num(id) { return parseFloat(document.getElementById(id).value) || 0; }
  function set(id, v) { document.getElementById(id).textContent = v; }

  function compute() {
    var mass = num('mass'), comp = num('compliance');
    if (mass > 0 && comp > 0) {
      var f = E.resonance(mass, comp);
      set('o-res', (Math.round(f * 10) / 10) + ' Hz');
      set('o-resverdict', E.resonanceVerdict(f));
    } else { set('o-res', '-'); set('o-resverdict', '-'); }
    var radius = num('radius'), rpm = num('rpm');
    if (radius > 0 && rpm > 0) {
      var v = E.grooveVelocity(radius, rpm);
      set('o-vel', (Math.round(v * 10) / 10) + ' cm/s');
      set('o-velverdict', E.velocityVerdict(v));
    } else { set('o-vel', '-'); set('o-velverdict', '-'); }
    var life = num('life'), used = num('used'), perday = num('perday');
    if (life > 0 && perday > 0) {
      var left = E.stylusLeft(life, used);
      set('o-left', Math.round(left) + ' h');
      set('o-days', Math.round(E.listeningDays(left, perday)) + ' days');
      set('o-sides', E.sidesPerStylus(life, 22));
    } else { set('o-left', '-'); set('o-days', '-'); set('o-sides', '-'); }
  }

  var presets = [
    { name: 'Typical 12-inch', v: { mass: 15, compliance: 10, radius: 6, rpm: 33.33, life: 1000, used: 400, perday: 2 } },
    { name: 'Heavy arm, soft cart', v: { mass: 20, compliance: 22, radius: 6, rpm: 33.33, life: 1000, used: 100, perday: 1.5 } },
    { name: '7-inch 45 single', v: { mass: 10, compliance: 20, radius: 8.7, rpm: 45, life: 600, used: 50, perday: 1 } },
    { name: 'End of the side', v: { mass: 12, compliance: 12, radius: 5.5, rpm: 33.33, life: 1000, used: 950, perday: 2.5 } }
  ];
  var holder = document.getElementById('presets');
  presets.forEach(function (p) {
    var b = document.createElement('button');
    b.textContent = p.name;
    b.addEventListener('click', function () {
      Object.keys(p.v).forEach(function (k) {
        var el = document.getElementById(k);
        if (el) el.value = p.v[k];
      });
      compute();
    });
    holder.appendChild(b);
  });

  ['mass', 'compliance', 'radius', 'rpm', 'life', 'used', 'perday'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('input', compute);
    el.addEventListener('change', compute);
  });
  compute();
})();
</script>
</body>
</html>
